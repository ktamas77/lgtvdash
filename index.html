<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LG TV</title>
<style>
  :root { --bg: #f6f6f4; --card: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #e4e4df; --ok: #2f7d4f; --bad: #b3412f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --fg: #ececea; --muted: #9a9a94; --line: #33332f; --ok: #6cc28e; --bad: #e58a78; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 6px; cursor: pointer; }
  #status { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .wide { grid-column: 1 / -1; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar span { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--fg); }
  .bar input[type=range] { flex: 1; min-width: 0; accent-color: var(--fg); }
  .bar button { padding: 2px 10px; font-size: 12px; }
  .on { color: var(--ok); font-weight: 600; }
  .err { color: var(--bad); }
  .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button:hover { border-color: var(--muted); }
  button:active { transform: translateY(1px); }
  button.link { border: 0; background: none; padding: 0; text-align: left; }
  button.link:hover { text-decoration: underline; }
  .remote { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: center; }
  .remote button { height: 44px; padding: 0; }
  .media { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .media button { width: 44px; padding: 6px 0; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .app { text-align: center; font-size: 12px; border: 0; background: none; padding: 4px; border-radius: 8px; }
  .app:hover { background: var(--line); }
  .app img { width: 72px; height: 72px; object-fit: contain; border-radius: 8px; background: var(--line); display: block; margin: 0 auto 4px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; color: var(--muted); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { font-size: 12px; overflow: auto; max-height: 320px; background: var(--bg); padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">LG TV</h1>
    <div class="actions"><span id="status">Loading…</span>
      <select id="tv" aria-label="TV"></select><button id="scan">Scan</button>
      <button data-cmd="powerOn">Power on</button><button data-cmd="powerOff">Power off</button>
      <button id="reload">Refresh</button></div>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "—").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const val = (r, f) => (r?.ok ? f(r.payload) : `<span class="err">${esc(r?.payload)}</span>`);
const bar = (v) => { const n = Number(v) || 0; return `<div class="bar"><span><i style="width:${Math.min(100, n)}%"></i></span>${n}</div>`; };
const rows = (pairs) => `<dl>${pairs.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
const card = (title, body, cls = "") => `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`;
const setting = (r, k) => val(r, (p) => esc(p.settings[k]));

let tvs = [], current = null;
// Remember the chosen TV per browser. Storage can be unavailable (private mode), so it's best effort.
const remembered = () => { try { return localStorage.getItem("tv"); } catch { return null; } };
const remember = (host) => { try { localStorage.setItem("tv", host); } catch {} };
const tvName = (t) => t?.name ?? t?.host ?? "LG TV";

async function loadTvs(scan = false) {
  if (scan) $("#status").textContent = "Scanning…";
  const res = await (scan
    ? fetch("/api/scan", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })
    : fetch("/api/tvs"));
  tvs = await res.json();
  if (!tvs.some((t) => t.host === current))
    current = (tvs.find((t) => t.host === remembered()) ?? tvs.find((t) => t.online) ?? tvs[0])?.host ?? null;
  $("#tv").innerHTML = tvs.map((t) =>
    `<option value="${esc(t.host)}"${t.host === current ? " selected" : ""}>${t.online ? "● " : "○ "}${esc(tvName(t))} (${esc(t.host)})</option>`
  ).join("") || "<option>No TVs</option>";
  $("#tv").disabled = !tvs.length;
}

// Shown even when the selected TV is off, so you can switch TVs or power it on.
function tvsCard() {
  return card(`TVs (${tvs.length})`, tvs.length ? `<table>${tvs.map((t) =>
    `<tr><td><button class="link" data-select="${esc(t.host)}">${t.host === current ? "▶ " : ""}${esc(tvName(t))}</button>
       <div style="color:var(--muted);font-size:12px">${esc(t.host)} · ${esc(t.model)} · ${esc(t.mac ?? "no MAC")}</div></td>
     <td>${t.sources.map(esc).join(" + ")}<br>${t.online ? '<span class="on">on network</span>' : "not seen"}${t.paired ? "" : " · not paired"}</td></tr>`
  ).join("")}</table>` : `<p>No TVs yet. Press <b>Scan</b> with the TV on, or add one to <code>tvs.json</code>.</p>`);
}

async function load() {
  const t = tvs.find((t) => t.host === current);
  $("#title").textContent = document.title = tvName(t);
  if (!t) {
    $("#grid").innerHTML = tvsCard();
    $("#status").textContent = "";
    return;
  }
  $("#status").textContent = t.paired ? "Loading…" : "Connecting… (first time: accept the pairing prompt on the TV)";
  // Never show one TV's data under another TV's name while the new one loads (an offline TV takes ~10s to fail).
  if ($("#grid").dataset.tv !== t.host) $("#grid").innerHTML = tvsCard();
  $("#grid").dataset.tv = t.host;
  try {
    const res = await fetch("/api/info?tv=" + encodeURIComponent(t.host));
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    if (t.host !== current) return; // switched TVs while this was loading
    render(d);
    $("#status").textContent = "Updated " + new Date().toLocaleTimeString();
    if (!t.paired) loadTvs();
  } catch (e) {
    if (t.host !== current) return;
    $("#grid").innerHTML = tvsCard() + card("Not reachable", `<p class="err">${esc(e.message)}</p><p>The TV may be off. Use <b>Power on</b> if it has a MAC.</p>`);
    $("#status").textContent = "";
  }
}

function render(d) {
  const name = d.netSettings.ok ? d.netSettings.payload.settings.deviceName : tvName(tvs.find((t) => t.host === current));
  $("#title").textContent = name;
  document.title = name;
  const inputs = d.inputs.ok ? d.inputs.payload.devices : [];
  const fgApp = d.foreground.ok ? d.foreground.payload.appId : "";
  const fgInput = inputs.find((i) => i.appId === fgApp);
  const t = d.time.ok ? d.time.payload.time : null;
  const pad = (n) => String(Number(n) || 0).padStart(2, "0");

  $("#grid").innerHTML = [
    card("Status", rows([
      ["Power", val(d.power, (p) => `<span class="on">${esc(p.state)}</span>`)],
      ["Showing", val(d.foreground, (p) => esc(fgInput ? `${fgInput.label} (${p.appId})` : p.appId))],
      ["Volume", val(d.volume, (p) =>
        `<div class="bar"><input id="vol" type="range" min="0" max="100" value="${Number(p.volume) || 0}" aria-label="Volume"><output id="volOut">${Number(p.volume) || 0}</output>
         <button id="mute" aria-pressed="${p.muted === true}">${p.muted ? "Unmute" : "Mute"}</button></div>`)],
      ["Sound output", val(d.soundOutput, (p) => esc(p.soundOutput))],
      ["TV clock", t ? `${pad(t.year)}-${pad(t.month)}-${pad(t.day)} ${pad(t.hour)}:${pad(t.minute)}` : val(d.time)],
    ])),
    card("Device", rows([
      ["Model", val(d.system, (p) => esc(p.modelName))],
      ["Receiver", val(d.system, (p) => esc(p.receiverType))],
      ["DVR", val(d.system, (p) => esc(p.features?.dvr))],
      ["Country", setting(d.country, "country")],
      ["Audio guidance", setting(d.audioGuidance, "audioGuidance")],
      ["SIMPLINK (HDMI-CEC)", setting(d.simplink, "simplinkEnable")],
    ])),
    card("Picture", rows([
      ["Backlight", val(d.backlight, (p) => bar(p.settings.backlight))],
      ["Contrast", val(d.contrast, (p) => bar(p.settings.contrast))],
      ["Brightness", val(d.brightness, (p) => bar(p.settings.brightness))],
      ["Color", val(d.color, (p) => bar(p.settings.color))],
    ]) + `<p style="color:var(--muted);margin:10px 0 0;font-size:12px">Read-only: the TV refuses picture changes from third-party apps (401). Picture mode, sharpness, color temperature and energy saving are not readable either.</p>`),
    card("Network", rows([
      ["Wi-Fi MAC", val(d.network, (p) => esc(p.wifiInfo?.macAddress))],
      ["Wired MAC", val(d.network, (p) => esc(p.wiredInfo?.macAddress))],
      ["Wi-Fi Direct MAC", val(d.network, (p) => esc(p.P2PInfo?.macAddress))],
      ["Wake-on-LAN", val(d.netSettings, (p) => esc(p.settings.wolwowlOnOff))],
    ])),
    card("Inputs", `<table>${inputs.map((i) =>
      `<tr><td><button class="link" data-cmd="input" data-arg="${esc(i.id)}">${i.appId === fgApp ? "▶ " : ""}${esc(i.label)}</button></td><td class="${i.connected ? "on" : ""}">${i.connected ? "connected" : "—"}</td></tr>`
    ).join("") || `<tr><td>${val(d.inputs)}</td></tr>`}</table>`),
    card("Remote", `<div class="remote">
      <span></span><button data-cmd="button" data-arg="UP" aria-label="Up">▲</button><span></span>
      <button data-cmd="button" data-arg="LEFT" aria-label="Left">◀</button><button data-cmd="button" data-arg="ENTER">OK</button><button data-cmd="button" data-arg="RIGHT" aria-label="Right">▶</button>
      <span></span><button data-cmd="button" data-arg="DOWN" aria-label="Down">▼</button><span></span>
      <button data-cmd="button" data-arg="BACK">Back</button><button data-cmd="button" data-arg="HOME">Home</button><button data-cmd="button" data-arg="MENU">Settings</button>
    </div><div class="media">
      ${[["rewind", "⏪", "Rewind"], ["play", "▶", "Play"], ["pause", "⏸", "Pause"], ["stop", "⏹", "Stop"], ["fastForward", "⏩", "Fast forward"]]
        .map(([m, s, l]) => `<button data-cmd="media" data-arg="${m}" aria-label="${l}">${s}</button>`).join("")}
    </div>`),
    tvsCard(),
    card("Services", val(d.services, (p) => p.services.map((s) => `${esc(s.name)} v${esc(s.version)}`).join(", "))),
    card(`Apps (${d.apps.ok ? d.apps.payload.launchPoints.length : "?"})`, val(d.apps, (p) =>
      `<div class="apps">${p.launchPoints.map((a) =>
        `<button class="app" data-cmd="launch" data-arg="${esc(a.id)}"><img loading="lazy" alt="" src="${esc(a.mediumLargeIcon?.startsWith("http") ? a.mediumLargeIcon : a.icon)}">${a.id === fgApp ? "▶ " : ""}${esc(a.title)}</button>`
      ).join("")}</div>`), "wide"),
    card("Model config (tv.model.*)", val(d.config, (p) =>
      `<details><summary>${Object.keys(p.configs).length} flags</summary><pre>${esc(JSON.stringify(p.configs, null, 2))}</pre></details>`), "wide"),
    card("Raw responses", `<details><summary>All ${Object.keys(d).length} calls</summary><pre>${esc(JSON.stringify(d, null, 2))}</pre></details>`, "wide"),
  ].join("");

  const vol = $("#vol"), mute = $("#mute");
  if (vol) {
    vol.oninput = () => ($("#volOut").textContent = vol.value);
    // ponytail: sends on release (change), not on every drag step; the TV is slow per call.
    vol.onchange = () => cmd("volume", Number(vol.value));
    mute.onclick = async () => {
      const next = mute.getAttribute("aria-pressed") !== "true";
      if (await cmd("mute", next)) {
        mute.setAttribute("aria-pressed", next);
        mute.textContent = next ? "Unmute" : "Mute";
      }
    };
  }
}

async function cmd(action, arg) {
  $("#status").textContent = "Sending…";
  try {
    const res = await fetch("/api/cmd", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ tv: current, action, arg }) });
    const r = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(r.error ?? res.statusText);
    $("#status").textContent = "Sent " + new Date().toLocaleTimeString();
    return true;
  } catch (e) {
    $("#status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
    return false;
  }
}

// Any element with data-cmd sends that action; input/app/power changes refresh the view afterwards.
const select = (host) => {
  current = host;
  remember(host);
  $("#tv").value = host;
  load();
};
$("#tv").onchange = () => select($("#tv").value);
$("#scan").onclick = async () => { await loadTvs(true); load(); };

document.addEventListener("click", async (e) => {
  const pick = e.target.closest("[data-select]");
  if (pick) return select(pick.dataset.select);
  const el = e.target.closest("[data-cmd]");
  if (!el) return;
  const { cmd: action, arg } = el.dataset;
  if (!current) return;
  if (action === "powerOff" && !confirm(`Turn off ${tvName(tvs.find((t) => t.host === current))}?`)) return;
  if (await cmd(action, arg) && ["input", "launch", "powerOff", "powerOn"].includes(action))
    setTimeout(load, action === "powerOn" ? 8000 : 1500);
});

$("#reload").onclick = load;
loadTvs().then(load, (e) => ($("#status").innerHTML = `<span class="err">${esc(e.message)}</span>`));
</script>
</body>
</html>
